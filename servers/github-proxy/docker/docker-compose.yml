networks:
  gh-proxy-network:
    external: false
services:
  gh-proxy:
    image: gh-proxy
    container_name: gh-proxy
    restart: unless-stopped
    networks:
      - gh-proxy-network
    ports:
      - 127.0.0.1:8086:8086
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
      - PROXY_PORT=8086
