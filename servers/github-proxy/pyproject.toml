[project]
name = "github-proxy"
version = "0.1.0"
description = "Reverse proxy for GitHub REST API, restricted to PR/review endpoints"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "coverage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
