networks:
  thunderbird-proxy-network:
    external: false
services:
  thunderbird-proxy:
    image: thunderbird-proxy
    container_name: thunderbird-proxy
    restart: unless-stopped
    networks:
      - thunderbird-proxy-network
    # Loopback-only on purpose: the Thunderbird add-on (host) and local agents
    # are the only intended callers. Publishing beyond loopback would expose
    # "read and send mail as you" to the network.
    ports:
      - 127.0.0.1:8090:8090
    environment:
      - PROXY_PORT=8090
      - THUNDERBIRD_PROXY_TOKEN=${THUNDERBIRD_PROXY_TOKEN:-}
      - THUNDERBIRD_ADDON_TOKEN=${THUNDERBIRD_ADDON_TOKEN:-}
      - THUNDERBIRD_ADDON_SECRET=${THUNDERBIRD_ADDON_SECRET:-}
      - COMMAND_TIMEOUT=${COMMAND_TIMEOUT:-}
      - ALLOWED_SENDERS=${ALLOWED_SENDERS:-}
