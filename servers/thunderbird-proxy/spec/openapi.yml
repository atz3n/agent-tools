openapi: "3.0.3"
info:
  title: thunderbird-proxy
  version: "0.4.0"
  description: >
    Mail proxy for agents. Every agent-face operation is translated into a
    command from a closed set, executed by the Thunderbird MailExtension
    add-on, and returned to the caller. Each face has its own bearer token:
    agents use THUNDERBIRD_PROXY_TOKEN, the add-on uses
    THUNDERBIRD_ADDON_TOKEN under /addon/*. The proxy signs every
    add-on-face response with THUNDERBIRD_ADDON_SECRET as
    X-Proxy-Proof = HMAC-SHA256(secret, "<X-Addon-Nonce>\n<body>"), which
    the add-on verifies before executing anything. Non-whitelisted paths
    return 404; a whitelisted path with the wrong method returns 405; the
    error body is always {"error": "..."}. When Thunderbird is not connected
    or a command times out, 504 is returned; an add-on-side failure returns
    502. OPTIONS requests carrying an Origin from a moz-extension:// add-on
    are answered with 204 and CORS headers (preflight support).
servers:
  - url: http://localhost:8090
security:
  - bearerToken: []
paths:
  /status:
    get:
      summary: Proxy-local health and add-on connection state (no add-on round-trip)
      responses:
        "200":
          description: connected flag, lastSeen epoch, queued commands, add-on info
  /accounts:
    get:
      summary: List mail accounts (command accounts.list)
      parameters:
        - name: includeSubFolders
          in: query
          schema: { type: boolean }
      responses:
        "200": { description: "{ accounts: [...] }" }
        "502": { description: add-on reported a failure }
        "504": { $ref: "#/components/responses/Disconnected" }
  /identities:
    get:
      summary: List sending identities (command identities.list) — the ids for identityId
      parameters:
        - name: account
          in: query
          schema: { type: string }
      responses:
        "200": { description: "{ identities: [{ id, accountId, email, name }] }" }
        "502": { description: add-on reported a failure }
        "504": { $ref: "#/components/responses/Disconnected" }
  /folders:
    get:
      summary: List folders of one account (command folders.list)
      parameters:
        - name: account
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: "{ folders: [...] }" }
        "502": { description: add-on reported a failure }
        "504": { $ref: "#/components/responses/Disconnected" }
    post:
      summary: Create a sub-folder (command folders.create)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: new folder name — must not contain '/' }
                parentFolderId: { type: string, description: id of the parent folder (mutually exclusive with account + folder — both at once is 400) }
                account: { type: string, description: with folder — resolve the parent by account + name/path instead of parentFolderId }
                folder: { type: string, description: parent folder name or path (requires account; mutually exclusive with parentFolderId) }
      responses:
        "200": { description: "{ folder: {...} }" }
        "400": { description: invalid body (error names the offending field) }
        "502": { description: add-on reported a failure (e.g. parent folder not found) }
        "504": { $ref: "#/components/responses/Disconnected" }
  /folders/mark-read:
    post:
      summary: >
        Mark every message in a folder as read (command folders.markRead) —
        a set-level folder operation; for a selection of ids use
        POST /mail/mark, which also covers starring.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folderId: { type: string, description: folder to mark read }
                account: { type: string, description: with folder — resolve by account + name/path instead }
                folder: { type: string, description: folder name or path (requires account) }
      responses:
        "200": { description: "{ markedRead: true, folderId: <id> }" }
        "400": { description: invalid body (error names the offending field) }
        "502": { description: add-on reported a failure (e.g. folder not found) }
        "504": { $ref: "#/components/responses/Disconnected" }
  /folders/{folderId}:
    patch:
      summary: Rename a folder (command folders.update) — the id is path-derived and changes; the response carries the new one
      parameters:
        - { $ref: "#/components/parameters/FolderId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: new folder name — must not contain '/' }
      responses:
        "200": { description: "{ folder: {...} }" }
        "400": { description: invalid body }
        "502": { description: "add-on reported a failure — folder not found, or the rename collided with an existing folder in the same account (refused up front: Thunderbird's conflict prompt can hang forever)" }
        "504": { $ref: "#/components/responses/Disconnected" }
    delete:
      summary: Delete a folder (command folders.delete) — only when it and its sub-folders hold no messages
      parameters:
        - { $ref: "#/components/parameters/FolderId" }
      responses:
        "200": { description: "{ deleted: true }" }
        "502":
          description: >
            add-on reported a failure — folder not found, or a folder whose
            own or nested subtree still holds messages is never deleted;
            deleting IMAP folders fails upstream in current Thunderbird
            (bug 2013929)
        "504": { $ref: "#/components/responses/Disconnected" }
  /mail/list:
    get:
      summary: List messages of a folder, newest first (command messages.list)
      parameters:
        - { name: folderId, in: query, schema: { type: string } }
        - { name: account, in: query, schema: { type: string } }
        - { name: folder, in: query, schema: { type: string }, description: folder name or path (with account), or a raw folder id alone }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: "{ messages: [...] }" }
        "502": { description: add-on reported a failure }
        "504": { $ref: "#/components/responses/Disconnected" }
  /mail/search:
    get:
      summary: Search messages (command messages.search)
      parameters:
        - { name: subject, in: query, schema: { type: string } }
        - { name: body, in: query, schema: { type: string } }
        - { name: author, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string }, description: recipient address }
        - { name: unread, in: query, schema: { type: boolean }, description: only unread (true) or only read (false) }
        - { name: folderId, in: query, schema: { type: string } }
        - { name: account, in: query, schema: { type: string } }
        - { name: folder, in: query, schema: { type: string } }
      responses:
        "200": { description: "{ messages: [...] } — up to 500 results" }
        "502": { description: no search criteria given, or add-on-side failure }
        "504": { $ref: "#/components/responses/Disconnected" }
  /mail/send:
    post:
      summary: Send a message (command message.send)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, subject, body]
              properties:
                to: { type: array, items: { type: string }, minItems: 1 }
                cc: { type: array, items: { type: string } }
                bcc: { type: array, items: { type: string } }
                subject: { type: string }
                body: { type: string, description: plain-text body (ignored when html is set) }
                html: { type: string, description: send as HTML only — no plain-text alternative is attached and body is dropped }
                identityId: { type: string, description: sending identity (GET /identities); defaults to the account default identity }
      responses:
        "200": { description: "{ sent: true, message: {...} }" }
        "400": { description: invalid body (error names the offending field) }
        "403": { description: recipient outside ALLOWED_SENDERS }
        "502": { description: add-on reported a failure }
        "504": { $ref: "#/components/responses/Disconnected" }
  /mail/draft:
    post:
      summary: Save a message as a draft (command message.draft)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, subject, body]
              properties:
                to: { type: array, items: { type: string }, minItems: 1 }
                cc: { type: array, items: { type: string } }
                bcc: { type: array, items: { type: string } }
                subject: { type: string }
                body: { type: string }
                html: { type: string }
                identityId: { type: string }
      responses:
        "200": { description: "{ draft: true, message: {...} }" }
        "400": { description: invalid body }
        "403": { description: recipient outside ALLOWED_SENDERS }
        "502": { description: add-on reported a failure }
        "504": { $ref: "#/components/responses/Disconnected" }
  /mail/move:
    post:
      summary: >
        Move messages in batch (command messages.move) — one Thunderbird
        call for the whole selection, not one round-trip per message. The
        moved messages get new ids in the destination folder (ids are
        per-folder session keys) — re-list before touching them again.
        On slow providers a 504 timeout does not imply failure — the
        server-side move often still completes; re-list both folders before
        retrying. Batch endpoints exist only where Thunderbird natively
        takes id arrays or offers a set-level operation; tags stay
        per-message (PATCH /mail/{id}).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, to]
              properties:
                ids:
                  type: array
                  items: { oneOf: [ { type: string }, { type: integer } ] }
                  minItems: 1
                  maxItems: 500
                to: { type: string, description: target folder id }
      responses:
        "200": { description: "{ moved: <count>, folderId: <id> }" }
        "400": { description: invalid body (error names the offending field) }
        "502": { description: add-on reported a failure }
        "504": { $ref: "#/components/responses/Disconnected" }
  /mail/mark:
    post:
      summary: >
        Flag messages in batch (command messages.mark) — bulk read/star via
        Thunderbird's set-level folder operations, executed by the bundled
        mailBulk experiment API: one set-level call per folder holding the
        messages, never one per message. No folder locator — session message
        ids resolve globally, each carrying its own folder. Every id must
        resolve before anything is marked, so a single unknown id marks
        nothing and names itself in the error. Tags are not part of this
        endpoint (no native bulk path — use PATCH /mail/{id}).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { oneOf: [ { type: string }, { type: integer } ] }
                  minItems: 1
                  maxItems: 500
                read: { type: boolean }
                starred: { type: boolean }
      responses:
        "200": { description: "{ updated: <count> }" }
        "400": { description: invalid body (no flags, unsupported field) }
        "502": { description: add-on reported a failure (message ids not found — ids are per-session, re-list them) }
        "504": { $ref: "#/components/responses/Disconnected" }
  /mail/trash:
    post:
      summary: >
        Move messages to the Trash in batch (command messages.trash) — one
        Thunderbird call, never a purge. If any listed message already sits
        in a trash-type folder, nothing is moved and the error names the id
        (a second delete would purge it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { oneOf: [ { type: string }, { type: integer } ] }
                  minItems: 1
                  maxItems: 500
      responses:
        "200": { description: "{ trashed: <count> }" }
        "400": { description: invalid body }
        "502": { description: add-on reported a failure (a message is already in the Trash — its id is named) }
        "504": { $ref: "#/components/responses/Disconnected" }
  /mail/{messageId}:
    get:
      summary: Read one message — header plus body parts (command message.get)
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
      responses:
        "200": { description: "{ header: {...}, parts: {...} }" }
        "502": { description: add-on reported a failure }
        "504": { $ref: "#/components/responses/Disconnected" }
    patch:
      summary: Update flags or move a message (command message.update)
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                read: { type: boolean }
                starred: { type: boolean }
                tags: { type: array, items: { type: string } }
                moveTo: { type: string, description: target folder id (moves the message) — must be non-empty }
                junk: { type: boolean, description: mark as (un)junk — true additionally moves the message to the account's junk folder when one resolves }
      responses:
        "200": { description: '{ updated: true } — with junk also { movedToJunk: "<folderId>" | false }' }
        "400": { description: invalid body }
        "502": { description: add-on reported a failure }
        "504": { $ref: "#/components/responses/Disconnected" }
    delete:
      summary: >
        Delete a message (command message.delete) — moves it to the account's
        Trash; the proxy never deletes mail permanently, so a message already
        in a trash-type folder cannot be deleted again.
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
      responses:
        "200": { description: "{ deleted: true } — the message is in the Trash" }
        "502":
          description: >
            add-on reported a failure (message already in the Trash, or
            trash membership could not be determined — the guard fails
            closed and refuses to delete)
        "504": { $ref: "#/components/responses/Disconnected" }
  /addon/hello:
    post:
      summary: Add-on face — register the add-on (called by Thunderbird, not agents)
      security:
        - addonToken: []
      responses:
        "200": { description: "{ ok: true }, signed with X-Proxy-Proof" }
  /addon/poll:
    get:
      summary: Add-on face — long-poll for one queued command
      security:
        - addonToken: []
      parameters:
        - { name: X-Addon-Nonce, in: header, required: false, schema: { type: string }, description: per-request nonce mixed into the response signature }
      responses:
        "200": { description: "{ id, command, params }, signed with X-Proxy-Proof" }
        "204": { description: "no command within the poll window (also signed)" }
  /addon/status:
    get:
      summary: Add-on face — health probe for the add-on options page (no round-trip)
      security:
        - addonToken: []
      responses:
        "200": { description: "connected flag and add-on info, signed with X-Proxy-Proof" }
  /addon/result:
    post:
      summary: Add-on face — report a command result
      security:
        - addonToken: []
      responses:
        "200": { description: "{ ok: true }" }
        "404": { description: unknown command id }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: THUNDERBIRD_PROXY_TOKEN (agent face)
    addonToken:
      type: http
      scheme: bearer
      description: THUNDERBIRD_ADDON_TOKEN (add-on face only)
  parameters:
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
      description: >
        Opaque Thunderbird message id (numeric for current Thunderbird
        builds — the add-on converts it with Number()). Valid only for the
        current Thunderbird session — re-fetch ids after a Thunderbird
        restart.
    FolderId:
      name: folderId
      in: path
      required: true
      schema: { type: string }
      description: >
        Thunderbird folder id, percent-encoded (ids contain '/', ':' and
        sometimes '[ ]', e.g. "account4%3A%2F%2FINBOX%2FNews"). Ids are
        path-derived — renaming a folder changes its id.
  responses:
    Disconnected:
      description: Thunderbird not connected, or the command timed out
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
