<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Thunderbird Proxy Bridge — Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 34rem; }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
    input { width: 100%; padding: 0.4rem; box-sizing: border-box; }
    #status { margin-top: 1rem; min-height: 1.2rem; }
    #status.ok { color: #2e7d32; }
    #status.bad { color: #c62828; }
    button { margin-top: 1rem; padding: 0.4rem 1rem; }
    p.hint { color: #666; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Thunderbird Proxy Bridge</h1>
  <p class="hint">
    The bridge polls the thunderbird-proxy for commands. Both must share the
    same token (the <code>THUNDERBIRD_PROXY_TOKEN</code> of the proxy's
    <code>secrets/</code> file).
  </p>
  <label for="proxyUrl">Proxy URL</label>
  <input id="proxyUrl" type="text" placeholder="http://localhost:8090" />
  <label for="token">Shared token</label>
  <input id="token" type="password" />
  <div>
    <button id="save">Save</button>
    <button id="test">Test connection</button>
  </div>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
