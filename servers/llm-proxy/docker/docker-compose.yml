networks:
  llm-proxy-network:
    external: false
services:
  llm-proxy:
    image: llm-proxy
    container_name: llm-proxy
    networks:
      - llm-proxy-network
    ports:
      - 127.0.0.1:8089:8089
    # So the mlx-serve route can reach a model server on the host, also on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_PROXY_TOKEN=${LLM_PROXY_TOKEN:-}
      - MLX_SERVE_URL=${MLX_SERVE_URL:-}
      - ALLOWED_MODELS=${ALLOWED_MODELS:-}
      - LLM_UPSTREAM_TIMEOUT=${LLM_UPSTREAM_TIMEOUT:-600}
